; Audio-ESP32 V2 - classic ESP32 / NodeMCU-32S (not C3/S3)
[env:nodemcu-32s]
platform = espressif32@6.12.0
board = nodemcu-32s
#board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
board_build.partitions = partitions.csv
lib_deps =
    earlephilhower/ESP8266Audio@1.9.9
    https://github.com/pschatzmann/ESP32-A2DP/archive/refs/tags/v1.8.3.zip
lib_ldf_mode = deep+
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DA2DP_LEGACY_I2S_SUPPORT=1
    -DA2DP_I2S_AUDIOTOOLS=0
    -DA2DP_SPP_SUPPORT=0
